# Settles PENDING payments whose browser/webhook callback never arrived.
# A failed run emails the repo owners (GitHub's default), which doubles as an alert.
# Required repo secrets: APP_URL, CRON_SECRET (same as fees-backup-cron.yml).
name: Reconcile payments cron

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call reconcile-payments cron
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing APP_URL or CRON_SECRET secrets"
            exit 1
          fi
          curl -fsS --max-time 90 -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/reconcile-payments"
