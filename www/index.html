<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Timelly</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        color: #fff;
        background: linear-gradient(
          135deg,
          #28143f 0%,
          #652875 40%,
          #804a5f 70%,
          #3f262f 100%
        );
      }
      .card {
        max-width: 420px;
        text-align: center;
      }
      h1 {
        font-size: 1.75rem;
        margin-bottom: 0.75rem;
      }
      p {
        line-height: 1.5;
        opacity: 0.85;
        margin-bottom: 0.5rem;
      }
      code {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.5rem 0.75rem;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.25);
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Timelly</h1>
      <p>School ERP &amp; Management</p>
      <p>
        Set <strong>CAPACITOR_SERVER_URL</strong> to your deployed Timelly URL,
        then run <code>npm run cap:sync</code>.
      </p>
    </div>
  </body>
</html>
